# BTCPay Server for the demo, on regtest. Bitcoin here has no value: the blocks and the coins are made locally.
# Two ports listen on the host, local only: BTCPay at 127.0.0.1:49392, and the front door at 127.0.0.1:8088.
# A tunnel (tunel.ps1) publishes the front door, so the sites on Vercel reach BTCPay and visitors reach the
# test wallet. Start: docker compose -f infra/btcpay/docker-compose.yml up -d
# Machine-only settings (an antivirus root, for example) go in infra/btcpay/local/, which git ignores, and are
# added with COMPOSE_FILE in infra/btcpay/.env.

name: cacao-btcpay

services:
  bitcoind:
    image: btcpayserver/bitcoin:31.1
    restart: unless-stopped
    environment:
      BITCOIN_NETWORK: regtest
      BITCOIN_WALLETDIR: /walletdata
      BITCOIN_EXTRA_ARGS: |
        rpcuser=cacao
        rpcpassword=cacao-regtest
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        fallbackfee=0.0002
        txindex=1
        zmqpubrawblock=tcp://0.0.0.0:28332
        zmqpubrawtx=tcp://0.0.0.0:28333
    volumes:
      - bitcoin_datadir:/data
      - bitcoin_wallet_datadir:/walletdata

  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_datadir:/var/lib/postgresql/data

  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.19
    restart: unless-stopped
    depends_on: [bitcoind, postgres]
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_CHAINS: btc
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_BTCRPCURL: http://bitcoind:43782/
      NBXPLORER_BTCRPCUSER: cacao
      NBXPLORER_BTCRPCPASSWORD: cacao-regtest
      NBXPLORER_BTCNODEENDPOINT: bitcoind:39388
      NBXPLORER_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer
      NBXPLORER_NOAUTH: 1
      NBXPLORER_EXPOSERPC: 1
    volumes:
      - nbxplorer_datadir:/datadir

  btcpayserver:
    image: btcpayserver/btcpayserver:2.4.5
    restart: unless-stopped
    depends_on: [nbxplorer, postgres]
    ports:
      - "127.0.0.1:49392:49392"
    environment:
      BTCPAY_NETWORK: regtest
      BTCPAY_CHAINS: btc
      BTCPAY_BIND: 0.0.0.0:49392
      BTCPAY_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=btcpayserver
      BTCPAY_EXPLORERPOSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_DOCKERDEPLOYMENT: "true"
      # Shows the test buttons on the checkout (pay, mine a block). Regtest only.
      BTCPAY_CHEATMODE: "true"
      # The server's own Lightning node. Small amounts are dust on-chain, so they are paid by Lightning.
      BTCPAY_BTCLIGHTNING: type=lnd-rest;server=https://lnd_cacao:8080/;macaroonfilepath=/etc/lnd_cacao/data/chain/bitcoin/regtest/admin.macaroon;allowinsecure=true
    volumes:
      - btcpay_datadir:/datadir
      - nbxplorer_datadir:/root/.nbxplorer
      - lnd_cacao_datadir:/etc/lnd_cacao:ro

  # Front door: the test wallet at /billetera, and BTCPay for everything else. ngrok publishes this port.
  puerta:
    image: node:22-alpine
    restart: unless-stopped
    depends_on: [btcpayserver, lnd_comprador]
    command: ["node", "/app/servidor.mjs"]
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./billetera:/app:ro
      - lnd_comprador_datadir:/lnd:ro

  # Lightning node of Cacao. The stores receive here.
  lnd_cacao:
    image: btcpayserver/lnd:v0.21.3-beta-2
    restart: unless-stopped
    depends_on: [bitcoind]
    environment: &lnd
      LND_CHAIN: btc
      LND_ENVIRONMENT: regtest
      LND_ALIAS: cacao
      LND_PORT: 9735
      LND_REST_LISTEN_HOST: https://lnd_cacao:8080
      LND_EXTRA_ARGS: |
        restlisten=0.0.0.0:8080
        rpclisten=0.0.0.0:10009
        bitcoin.node=bitcoind
        bitcoind.rpchost=bitcoind:43782
        bitcoind.rpcuser=cacao
        bitcoind.rpcpass=cacao-regtest
        bitcoind.zmqpubrawblock=tcp://bitcoind:28332
        bitcoind.zmqpubrawtx=tcp://bitcoind:28333
        noseedbackup=1
        tlsextradomain=lnd_cacao
        tlsextradomain=lnd_comprador
        accept-keysend=1
    volumes:
      - lnd_cacao_datadir:/data

  # Lightning node of the test buyer. It pays the invoices of the demo through its channel to lnd_cacao.
  lnd_comprador:
    image: btcpayserver/lnd:v0.21.3-beta-2
    restart: unless-stopped
    depends_on: [bitcoind]
    environment:
      <<: *lnd
      LND_ALIAS: comprador
      LND_REST_LISTEN_HOST: https://lnd_comprador:8080
    volumes:
      - lnd_comprador_datadir:/data

volumes:
  bitcoin_datadir:
  bitcoin_wallet_datadir:
  postgres_datadir:
  nbxplorer_datadir:
  btcpay_datadir:
  lnd_cacao_datadir:
  lnd_comprador_datadir:
