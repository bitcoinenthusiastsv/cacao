<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tu código de CacaoMarket</title>
  </head>
  <body style="margin:0;padding:0;background:#F5EDE3;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F5EDE3;">
      <tr>
        <td align="center" style="padding:24px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#F5EDE3;font-family:Arial,Helvetica,sans-serif;color:#2A1912;">
            <tr>
              <td style="padding:0 0 16px 0;font-size:18px;font-weight:700;color:#2A1912;">
                Tu código para entrar a CacaoMarket
              </td>
            </tr>
            <tr>
              <td style="padding:0 0 16px 0;font-size:16px;line-height:1.5;color:#2A1912;">
                Escribí este código en la página para entrar:
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 0 24px 0;">
                <span style="display:inline-block;font-family:'Courier New',Courier,monospace;font-size:36px;font-weight:700;letter-spacing:8px;color:#2A1912;">{{ .Token }}</span>
              </td>
            </tr>
            <tr>
              <td style="padding:0;font-size:14px;line-height:1.5;color:#2A1912;">
                Vence en una hora. Si no lo pediste, ignorá este correo.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
